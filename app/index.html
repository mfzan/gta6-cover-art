<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Maker — GTA-style poster covers</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover Maker</h1>
    <p class="tag">Your photo, a caption, and a Vice City sunset — a poster cover in three steps.</p>
    <div class="slots">
      <button class="slot active" type="button" data-slot="0">Panel 1 · Hero</button>
      <button class="slot" type="button" data-slot="1">Panel 2</button>
      <button class="slot" type="button" data-slot="2">Panel 3</button>
    </div>
    <label>Photo for the selected panel
      <input id="photo" type="file" accept="image/*">
    </label>
    <p class="hint">Drag the photo on the preview to move it. Use zoom to fill the panel.</p>
    <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
    <label>Caption <input id="caption" type="text" maxlength="40" value="VICE CITY NIGHTS"></label>
    <label>Sub-caption <input id="subcaption" type="text" maxlength="60" value="One city. One night. No way out."></label>
    <label>Colour grade <select id="grade"></select></label>
    <label>Export size
      <select id="size">
        <option value="square">1080 x 1080 (square post)</option>
        <option value="portrait">1080 x 1350 (portrait post)</option>
        <option value="wide">1920 x 1080 (wide post)</option>
      </select>
    </label>
    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="stage">
    <canvas id="preview" width="540" height="540" aria-label="Cover preview — click a panel, drag to move the photo"></canvas>
    <canvas id="cover" width="1080" height="1080" hidden aria-hidden="true"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
